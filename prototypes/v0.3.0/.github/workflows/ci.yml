name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: navi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '24'
          - os: windows-latest
            node: '24'
          - os: macos-latest
            node: '24'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate source and run unit tests
        run: npm run check
  package:
    name: Build development VSIX
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble VSIX without publishing
        env:
          NAVI_VSIX_OUTPUT_DIR: ${{ github.workspace }}/dist
        run: python3 scripts/build_vsix.py
      - name: Validate archive contents
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import json, zipfile
          m = json.loads(Path('package.json').read_text())
          p = Path('dist') / f"navi-{m['version']}.vsix"
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert {'extension.vsixmanifest', 'extension/package.json', 'extension/src/extension.js'}.issubset(z.namelist())
          print(f'Validated {p}')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: navi-development-vsix
          path: dist/*.vsix
          if-no-files-found: error
          retention-days: 14
