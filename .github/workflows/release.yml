name: Publish GitHub preview

on:
  workflow_run:
    workflows: [CI and VSIX]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: navi-github-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Require successful native Windows acceptance
        timeout-minutes: 6
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          for attempt in {1..60}; do
            RESULT="$(gh api "repos/$GH_REPO/actions/workflows/overlay-native.yml/runs?head_sha=$COMMIT&branch=main&event=push&per_page=5" --jq '.workflow_runs[0].conclusion // "pending"')"
            case "$RESULT" in
              success) echo "Native Windows acceptance passed for $COMMIT."; exit 0 ;;
              pending) sleep 5 ;;
              *) echo "Native Windows acceptance did not pass: $RESULT"; exit 1 ;;
            esac
          done
          echo "Native Windows acceptance is still pending; release not published."
          exit 1
      - name: Verify checked-in VSIX and publish preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          TAG="v$VERSION"
          VSIX="downloads/navi-copilot-companion-$VERSION.vsix"
          (cd downloads && sha256sum -c "navi-copilot-companion-$VERSION.vsix.sha256")
          python3 - "$VSIX" "$VERSION" <<'PY'
          import hashlib, json, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              manifest = json.loads(archive.read('extension/package.json'))
              assert manifest['version'] == sys.argv[2]
              helper = archive.read('extension/bin/win32-x64/navi-overlay.exe')
              checksum = archive.read('extension/bin/win32-x64/navi-overlay.exe.sha256').decode().split()[0]
              assert hashlib.sha256(helper).hexdigest() == checksum
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          NOTES="${RUNNER_TEMP}/navi-release-notes.md"
          cat "docs/releases/v$VERSION.en.md" > "$NOTES"
          printf '\n\n---\n\n' >> "$NOTES"
          cat "docs/releases/v$VERSION.de.md" >> "$NOTES"
          ASSETS=("$VSIX" "$VSIX.sha256")
          for AUDIT in "downloads/navi-animation-audit-$VERSION.json" "downloads/navi-anchor-audit-$VERSION.json"; do
            if [[ -f "$AUDIT" ]]; then ASSETS+=("$AUDIT"); fi
          done
          gh release create "$TAG" "${ASSETS[@]}" \
            --target "$(git rev-parse HEAD)" --title "NAVI $TAG (Preview)" \
            --notes-file "$NOTES" --prerelease
