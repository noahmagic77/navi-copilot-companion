name: CI and VSIX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test

  package-vsix:
    name: Package VSIX
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile extension
        run: npm run compile
      - name: Build VSIX
        shell: bash
        run: |
          mkdir -p build
          VERSION="$(node -p "require('./package.json').version")"
          npx --no-install vsce package --no-dependencies --out "build/navi-copilot-companion-${VERSION}.vsix"
      - name: Validate package contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json, hashlib
          vsix_files = list(Path('build').glob('*.vsix'))
          assert len(vsix_files) == 1, f'Expected exactly one VSIX, got {len(vsix_files)}'
          with ZipFile(vsix_files[0]) as package:
              files = set(package.namelist())
              required = {
                  'extension/package.json',
                  'extension/LICENSE.md',
                  'extension/THIRD_PARTY_NOTICES.md',
                  'extension/dist/src/extension.js',
                  'extension/dist/src/brain/brain.js',
                  'extension/dist/src/brain/expression.js',
                  'extension/dist/src/brain/decisions.js',
                  'extension/dist/src/brain/presence.js',
                  'extension/dist/src/brain/inspection.js',
                  'extension/dist/src/brain/memories.js',
                  'extension/dist/src/companion/companion.js',
                  'extension/dist/src/companion/problems.js',
                  'extension/dist/src/integration/voice.js',
                  'extension/dist/src/ui/brainView.js',
                  'extension/dist/src/ui/brainContent.js',
                  'extension/dist/src/integration/naviMcp.js',
                  'extension/dist/src/integration/bridge.js',
                  'extension/dist/src/integration/activity.js',
                  'extension/dist/src/chat/modelTurn.js',
                  'extension/dist/src/ui/naviView.js',
                  'extension/dist/src/ui/fairyMarkup.js',
                  'extension/dist/src/ui/webviewContent.js',
                  'extension/media/fairy.css',
                  'extension/media/fairy.js',
                  'extension/media/fairy-motion.js',
                  'extension/media/fairy-expression.js',
                  'extension/media/fairy-sound.js',
                  'extension/media/icon.svg',
                  'extension/media/logo.png',
                  'extension/bin/win32-x64/navi-overlay.exe',
                  'extension/bin/win32-x64/navi-overlay.exe.sha256',
                  'extension/dist/src/overlay/overlayController.js',
                  'extension/dist/src/overlay/overlayProcess.js',
                  'extension/dist/src/overlay/editorAnchor.js',
              }
              required.update(f'extension/media/sounds/{cue}-{variant}.wav'
                              for cue in ('greeting', 'discover', 'hint', 'celebrate')
                              for variant in range(3))
              assert required.issubset(files), f'Missing: {required - files}'
              removed = {'extension/dist/src/core/promptAnalyzer.js', 'extension/dist/src/core/otelParser.js', 'extension/dist/src/storage/sessionJournal.js'}
              assert not removed.intersection(files), f'Retired analysis modules packaged: {removed.intersection(files)}'
              manifest = json.loads(package.read('extension/package.json'))
              helper = package.read('extension/bin/win32-x64/navi-overlay.exe')
              expected_hash = package.read('extension/bin/win32-x64/navi-overlay.exe.sha256').decode().split()[0]
              assert hashlib.sha256(helper).hexdigest() == expected_hash
              assert manifest['publisher'] == 'navi-labs'
              assert manifest['license'] == 'MIT'
              assert manifest['version'] == json.loads(Path('package.json').read_text())['version']
          print('VSIX manifest and essential assets verified')
          PY
      - name: Upload installable VSIX
        uses: actions/upload-artifact@v4
        with:
          name: NAVI-VSIX-${{ github.run_number }}
          path: build/*.vsix
          if-no-files-found: error
          retention-days: 30
